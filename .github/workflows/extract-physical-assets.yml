name: Install physical Lavendish assets

on:
  push:
    branches:
      - site-assets-install
    paths:
      - asset-upload/part-08.txt

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild physical image package
        shell: bash
        run: |
          set -euo pipefail
          cat asset-upload/part-*.txt | base64 -d > /tmp/lavendish-assets.tgz
          rm -rf assets/mojitos assets/icons
          tar -xzf /tmp/lavendish-assets.tgz -C .
          test "$(find assets/mojitos -type f -name '*.webp' | wc -l)" -eq 14
          test "$(find assets/icons -type f -name '*.webp' | wc -l)" -eq 14
      - name: Commit physical image files
        shell: bash
        run: |
          git config user.name "Lavendish Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/mojitos assets/icons
          git commit -m "Add 28 physical Mojito and flavor image assets"
          git push origin HEAD:site-assets-install
