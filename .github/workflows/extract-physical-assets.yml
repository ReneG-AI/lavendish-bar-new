name: Extract physical image assets

on:
  push:
    branches:
      - site-assets-install
    paths:
      - .github/workflows/extract-physical-assets.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Extract physical WebP files from CSS sprites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, re
          from PIL import Image

          names = [
              'original','fresa','frutos-bosque','pina','coco','pina-colada','maracuya',
              'mango','frambuesa','melocoton','sandia','cereza','manzana-verde','uva'
          ]

          def decode_sprite(css_path):
              css = Path(css_path).read_text(encoding='utf-8')
              match = re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', css)
              if not match:
                  raise RuntimeError(f'No WebP data URI found in {css_path}')
              payload = match.group(1)
              payload += '=' * (-len(payload) % 4)
              raw = base64.b64decode(payload)
              return Image.open(BytesIO(raw)).convert('RGBA')

          def split(css_path, out_dir, pattern):
              image = decode_sprite(css_path)
              cell_w = image.width // 7
              cell_h = image.height // 2
              out = Path(out_dir)
              out.mkdir(parents=True, exist_ok=True)
              for i, name in enumerate(names):
                  x = (i % 7) * cell_w
                  y = (i // 7) * cell_h
                  crop = image.crop((x, y, x + cell_w, y + cell_h))
                  crop.save(out / pattern.format(name=name), 'WEBP', quality=82, method=6, exact=True)
              print(f'{css_path}: {image.size} -> {cell_w}x{cell_h}, {len(names)} files')

          split('css/style-05.css', 'assets/mojitos', 'mojito-{name}-stable.webp')
          split('css/style-04.css', 'assets/icons', '{name}.webp')
          PY
      - name: Commit physical image files
        shell: bash
        run: |
          git config user.name "Lavendish Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/mojitos assets/icons
          git commit -m "Add physical Mojito and flavor image assets"
          git push origin HEAD:site-assets-install
