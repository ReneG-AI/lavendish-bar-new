name: Extract physical image assets

on:
  push:
    branches:
      - site-assets-install
    paths:
      - assets/mojitos-sprite.webp

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Split Mojito and flavor image sprites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              'original','fresa','frutos-bosque','pina','coco','pina-colada','maracuya',
              'mango','frambuesa','melocoton','sandia','cereza','manzana-verde','uva'
          ]

          def split(src, out_dir, pattern):
              image = Image.open(src).convert('RGBA')
              cell_w = image.width // 7
              cell_h = image.height // 2
              out = Path(out_dir)
              out.mkdir(parents=True, exist_ok=True)
              for i, name in enumerate(names):
                  x = (i % 7) * cell_w
                  y = (i // 7) * cell_h
                  crop = image.crop((x, y, x + cell_w, y + cell_h))
                  crop.save(out / pattern.format(name=name), 'WEBP', lossless=True, method=6)
              print(f'{src}: {image.size} -> {cell_w}x{cell_h}, {len(names)} files')

          split('assets/mojitos-sprite.webp', 'assets/mojitos', 'mojito-{name}-stable.webp')
          split('assets/icons-sprite.webp', 'assets/icons', '{name}.webp')
          PY
      - name: Commit physical image files
        shell: bash
        run: |
          git config user.name "Lavendish Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/mojitos assets/icons
          git commit -m "Add physical Mojito and flavor image assets"
          git push origin HEAD:site-assets-install
