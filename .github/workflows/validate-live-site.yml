name: Validate official live site

on:
  push:
    branches:
      - site-assets-install
    paths:
      - .github/workflows/validate-live-site.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate repository image files
        shell: bash
        run: |
          set -euo pipefail
          file assets/favicon.png assets/lavendish-logo.webp assets/lavendish-storefront.webp assets/pina-float.webp
          test -s assets/favicon.png
          test -s assets/lavendish-logo.webp
          test -s assets/lavendish-storefront.webp
          test -s assets/pina-float.webp
      - name: Validate GitHub Pages responses
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            'https://reneg-ai.github.io/lavendish-bar-new/' \
            'https://reneg-ai.github.io/lavendish-bar-new/assets/lavendish-logo.webp' \
            'https://reneg-ai.github.io/lavendish-bar-new/assets/pina-float.webp' \
            'https://reneg-ai.github.io/lavendish-bar-new/assets/lavendish-storefront.webp' \
            'https://reneg-ai.github.io/lavendish-bar-new/css/style-00.css'; do
            echo "=== $u"
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' "$u")
            echo "HTTP=$code bytes=$(wc -c </tmp/body) type=$(file -b /tmp/body)"
          done
