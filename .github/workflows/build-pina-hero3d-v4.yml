name: Build Piña Colada Hero 3D v4

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pina-hero3d-v4-clean
    paths:
      - scripts/blender/create-pina-hero-v4.py
      - scripts/validate-pina-hero-v4.mjs
      - .github/workflows/build-pina-hero3d-v4.yml

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean v4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and headless GL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx0 libgl1-mesa-dri libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0
          blender --version
          python3 -c "import numpy; print('System NumPy', numpy.__version__)"

      - name: Verify Blender can import NumPy
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: blender -b --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"

      - name: Prepare clean generation workspace
        run: |
          rm -f assets/3d/pina-colada-hero-v4.glb
          rm -f assets/3d/pina-colada-hero-v4.blend
          rm -rf assets/3d/qa-v4
          mkdir -p assets/3d/qa-v4
          # Ubuntu 24.04 currently ships Blender 4.0, where the Eevee enum is BLENDER_EEVEE.
          sed -i 's/BLENDER_EEVEE_NEXT/BLENDER_EEVEE/g' scripts/blender/create-pina-hero-v4.py

      - name: Author and render premium Piña Colada
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: blender -b --python scripts/blender/create-pina-hero-v4.py

      - name: Assert fresh outputs exist
        run: |
          test -s assets/3d/pina-colada-hero-v4.glb
          test -s assets/3d/pina-colada-hero-v4.blend
          test -s assets/3d/qa-v4/hero_front.png
          test -s assets/3d/qa-v4/hero_right45.png

      - name: Validate GLB structure
        run: node scripts/validate-pina-hero-v4.mjs assets/3d/pina-colada-hero-v4.glb

      - name: Report output budget
        run: |
          ls -lh assets/3d/pina-colada-hero-v4.glb
          ls -lh assets/3d/pina-colada-hero-v4.blend
          ls -lh assets/3d/qa-v4/*.png
          sha256sum assets/3d/pina-colada-hero-v4.glb

      - name: Upload visual QA pack
        uses: actions/upload-artifact@v4
        with:
          name: pina-hero3d-v4-review
          path: |
            assets/pina-colada.webp
            assets/3d/pina-colada-hero-v4.glb
            assets/3d/pina-colada-hero-v4.blend
            assets/3d/qa-v4/*.png
          retention-days: 7

      - name: Commit generated hero asset
        run: |
          git checkout -- scripts/blender/create-pina-hero-v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/3d/pina-colada-hero-v4.glb
          if git diff --cached --quiet; then
            echo "GLB unchanged."
            exit 0
          fi
          git commit -m "build: generate Blender Piña Colada hero v4 GLB"
          git push
