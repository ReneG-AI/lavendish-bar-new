<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f10">
<meta name="robots" content="noindex,nofollow">
<title>LAVENDISH · Cargando preview</title>
<style>
html,body{margin:0;min-height:100%;background:#0d0f10;color:#f4eee3;font-family:system-ui,-apple-system,sans-serif}
.loader{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px}
.mark{font-family:Georgia,serif;font-size:clamp(2.4rem,9vw,5rem);margin:0}
.line{width:180px;height:2px;background:rgba(255,255,255,.12);margin:18px auto 0;overflow:hidden}
.line::after{content:"";display:block;width:55%;height:100%;background:#d4ae6b;animation:load 1.2s ease-in-out infinite}
p{opacity:.55;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(200%)}}
</style>
</head>
<body>
<div class="loader"><div><h1 class="mark">LAVENDISH</h1><div class="line"></div><p>Cargando preview</p></div></div>
<script>
(async()=>{
  try {
    const names = Array.from({length:17},(_,i)=>`part-${String(i).padStart(2,'0')}.txt`);
    const pieces = await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(n+' '+r.status);
      return r.text();
    })));
    document.open();
    document.write(pieces.join(''));
    document.close();
  } catch(err) {
    document.body.innerHTML='<div class="loader"><div><h1 class="mark">LAVENDISH</h1><p>No se ha podido cargar la preview.</p></div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
