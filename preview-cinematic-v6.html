<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#05070b">
  <title>LAVENDISH · Cinematic Intro V6</title>

  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preload" as="image" href="assets/pina-colada.webp?v=1.1.1" fetchpriority="high">
  <link rel="preload" as="image" href="assets/lavendish-storefront.webp?v=1.1.1">
  <link rel="stylesheet" href="css/cinematic-v6.css?v=0.1.0">
</head>
<body>
  <main class="cinematic-v6" data-cinematic-v6 data-state="loading" aria-label="Prueba de intro cinematográfica LAVENDISH">
    <section class="c6-layer c6-sky" aria-hidden="true">
      <img
        class="c6-image"
        data-c6-critical
        src="https://images.unsplash.com/photo-1722338366856-b6c44736a86e?auto=format&fit=crop&w=2400&q=82"
        alt=""
        decoding="async"
        fetchpriority="high">
    </section>

    <section class="c6-layer c6-bar" aria-hidden="true">
      <img
        class="c6-image"
        data-c6-critical
        src="assets/lavendish-storefront.webp?v=1.1.1"
        alt=""
        decoding="async">
    </section>

    <div class="c6-drink-wrap" aria-hidden="true">
      <img
        class="c6-drink"
        data-c6-critical
        src="assets/pina-colada.webp?v=1.1.1"
        alt=""
        width="900"
        height="1125"
        decoding="async"
        fetchpriority="high">
    </div>

    <div class="c6-vignette" aria-hidden="true"></div>
    <div class="c6-grain" aria-hidden="true"></div>

    <div class="c6-end">
      <div class="c6-lockup">
        <img class="c6-logo" src="assets/lavendish-logo.webp?v=1.1.1" alt="LAVENDISH" width="640" height="624">
        <p class="c6-location">Lleida · Balmes 21</p>
        <a class="c6-enter" href="./">Entrar</a>
      </div>
    </div>

    <button class="c6-skip" data-c6-skip type="button" aria-label="Saltar introducción">Saltar</button>
  </main>

  <script src="js/cinematic-v6.js?v=0.1.0" defer></script>
</body>
</html>
